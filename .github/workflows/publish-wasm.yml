name: Publish WASM Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2.9.2

      # wasm-bindgen refuses to run when the cli and the crate versions diverge, so resolve
      # the version from cargo instead of hardcoding it here
      - name: Resolve wasm-bindgen version
        id: wasm-bindgen
        run: |
          version=$(cargo metadata --format-version 1 --features wasm \
            | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          echo "Using wasm-bindgen $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2.87.0
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown --features wasm --no-default-features

      - name: Generate bindings
        # `--weak-refs` registers Rust-owned wasm-bindgen objects with the
        # JS `FinalizationRegistry`, so memory is reclaimed automatically
        # when the JS wrapper is garbage-collected. Removes the need for
        # callers to call `.free()` manually.
        run: wasm-bindgen --target web --weak-refs --out-dir pkg target/wasm32-unknown-unknown/release/vpin.wasm

      - name: Update package version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" pkg/package.json

      - name: Copy README
        run: cp wasm-readme.md pkg/README.md

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Using Trusted Publishing via OpenID Connect (OIDC) - no NPM_TOKEN needed
      # Configure at: https://www.npmjs.com/settings/francisdb/packages/@francisdb/vpin-wasm/access
      - name: Publish to npm
        run: npm publish ./pkg
