name: Clippy check
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Make sure CI fails on all warnings, including Clippy lints
env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  clippy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned so new clippy lints from a fresh stable release don't break CI,
      # dependabot proposes updates for this version
      - name: Install minimal toolchain with clippy and rustfmt
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Run Clippy
        run: cargo clippy --color always --all-targets --all-features
      # code behind a feature gate can leave items unused in other feature
      # sets, so the default and the minimal set are checked as well
      - name: Run Clippy with the default features
        run: cargo clippy --color always --all-targets
      - name: Run Clippy without default features
        run: cargo clippy --color always --all-targets --no-default-features
      - name: Check the wasm build for compiler warnings
        run: cargo check --color always --all-targets --target wasm32-unknown-unknown --features wasm
        env:
          # RUSTFLAGS replaces the target rustflags in .cargo/config.toml,
          # so the getrandom backend they select is repeated here
          RUSTFLAGS: '-Dwarnings --cfg getrandom_backend="wasm_js"'
      - name: Run fmt check
        run: cargo fmt --all --check -- --color=always
